name: Daily CMO Content Generation

on:
  schedule:
    # Run every day at 07:00 UTC (8am London / 3am New York)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit generated blog posts back to the repo

jobs:
  cmo-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CMO Content Generator
        run: node scripts/cmo-content-generator.mjs
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Check for Generated Blog Posts
        id: git-check
        run: |
          git diff --quiet src/blog/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Generated Blog Posts
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'NomadBudgeter CMO Bot'
          git config --global user.email 'cmo-bot@nomadbudgeter.com'
          git add src/blog/
          git commit -m "feat(blog): auto-generate CMO content batch [skip ci]"
          git push
