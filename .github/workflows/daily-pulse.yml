name: Daily Data Pulse

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit back to the repo

jobs:
  pulse-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use latest LTS
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Data Pulse & Trends
        run: |
          npm run pulse
          npm run trends
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}

      - name: Check for Changes
        id: git-check
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Updates
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/_data/freshness.json src/_data/rates.json src/_data/ticker.json src/_data/airtable_cache.json src/_data/best_cities.json
          git commit -m "chore(data): auto-update currency, BTC, city trends, and visa data [skip ci]"
          git push
